<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Автонакопление — Изменить</title>
  <style>
    @font-face {
      font-family: 'SB Sans Text';
      src: url('fonts/SB Sans Text.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'SB Sans Text';
      src: url('fonts/sb-sans-text-medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: 'SB Sans Text';
      src: url('fonts/SB-Sans-Text-Semibold.ttf') format('truetype');
      font-weight: 600;
      font-style: normal;
    }

    :root { --ff: 'SB Sans Text', -apple-system, sans-serif; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: var(--ff);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-synthesis: none;
    }

    .phone {
      position: relative;
      width: 402px;
      height: 874px;
      overflow: hidden;
      border-radius: 50px;
      background: #fff;
      box-shadow: 0 30px 80px rgba(0,0,0,0.3);
    }

    .scroll-area {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .scroll-area::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
<div class="phone">

  <!-- Status bar -->
  <div style="position:absolute;top:0;left:0;width:402px;height:62px;overflow:hidden;pointer-events:none;z-index:10;">
    <img src="assets/savings-status-bar.png" alt=""
      style="position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;mix-blend-mode:multiply;" />
  </div>

  <!-- Back arrow -->
  <a href="подключено.html"
    style="position:absolute;top:67px;left:2px;display:block;width:28px;height:28px;line-height:0;z-index:11;">
    <img src="assets/savings-chevron-left.svg" alt="Назад"
      style="width:28px;height:28px;max-width:none;" />
  </a>

  <!-- Scrollable content -->
  <div class="scroll-area">

    <!-- Top spacer (status bar + nav) -->
    <div style="height:96px;"></div>

    <!-- Header: title + subtitle -->
    <div style="margin:0 12px;display:flex;flex-direction:column;gap:4px;">
      <p style="font-family:var(--ff);font-size:20px;font-weight:600;color:#000;letter-spacing:-0.2px;line-height:normal;">Автонакопление</p>
      <p style="font-family:var(--ff);font-size:11px;font-weight:500;color:#4d4d4d;line-height:1.2;">за время подключения «По расписанию»</p>
    </div>

    <!-- Amount + progress bar -->
    <div style="margin:58px 12px 0;display:flex;flex-direction:column;gap:4px;">
      <p style="font-family:var(--ff);font-size:15px;font-weight:500;color:#000;line-height:normal;">
        20 000 Р <span style="font-family:var(--ff);font-size:11px;font-weight:500;color:#4d4d4d;line-height:1.2;">из 50 000 Р накопленных</span>
      </p>
      <!-- Progress bar -->
      <div style="position:relative;height:16px;width:100%;border-radius:6px;overflow:hidden;background:#fff;">
        <div style="position:absolute;inset:0;background:repeating-linear-gradient(-60deg,rgba(186,186,186,0.2) 0px,rgba(186,186,186,0.2) 4px,#fff 4px,#fff 10px);"></div>
        <div style="position:absolute;top:0;left:0;height:16px;width:40%;border-radius:6px;background:linear-gradient(86.6deg,#34C759 10.53%,#0EBAB1 99.7%);"></div>
      </div>
    </div>

    <!-- Two cells: amount + date (side by side) -->
    <div style="margin:12px 12px 0;display:flex;gap:6px;">

      <!-- Amount cell -->
      <div style="flex:1;background:#f5f5f5;border-radius:12px;display:flex;align-items:center;gap:12px;padding:0 12px;">
        <img src="assets/edit-pencil1.svg" alt=""
          style="width:24px;height:52px;flex-shrink:0;max-width:none;" />
        <div style="display:flex;flex-direction:column;gap:2px;padding:12px 0;">
          <p style="font-family:var(--ff);font-size:15px;font-weight:500;color:#000;line-height:normal;">5 000 Р</p>
          <p style="font-family:var(--ff);font-size:11px;font-weight:500;color:#4d4d4d;line-height:1.2;">Сумма пополнения</p>
        </div>
      </div>

      <!-- Date cell -->
      <div style="flex:1;background:#f5f5f5;border-radius:12px;display:flex;align-items:center;gap:12px;padding:0 12px;">
        <img src="assets/edit-pencil1.svg" alt=""
          style="width:24px;height:52px;flex-shrink:0;max-width:none;" />
        <div style="display:flex;flex-direction:column;gap:2px;padding:12px 0;">
          <p style="font-family:var(--ff);font-size:15px;font-weight:500;color:#000;line-height:normal;">24 ноября</p>
          <p style="font-family:var(--ff);font-size:11px;font-weight:500;color:#4d4d4d;line-height:1.2;">Дата следующего</p>
        </div>
      </div>

    </div>

    <!-- Source account cell (full width) -->
    <div style="margin:6px 12px 0;background:#f5f5f5;border-radius:12px;display:flex;align-items:center;gap:13px;padding:4px 12px;">
      <img src="assets/edit-pencil.svg" alt=""
        style="width:24px;height:44px;flex-shrink:0;max-width:none;" />
      <div style="display:flex;flex-direction:column;gap:4px;padding:8px 0;">
        <p style="font-family:var(--ff);font-size:15px;font-weight:500;color:#000;line-height:normal;">Дебетовый • 9432</p>
        <p style="font-family:var(--ff);font-size:11px;font-weight:500;color:#4d4d4d;line-height:1.2;">Откуда пополнять</p>
      </div>
    </div>

    <!-- Pause button (with bottom border as separator) -->
    <div style="margin:60px 12px 0;border-bottom:1px solid #e0e0e0;padding-bottom:12px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <img src="assets/edit-pausecircle.svg" alt=""
          style="width:24px;height:24px;flex-shrink:0;max-width:none;" />
        <p style="font-family:var(--ff);font-size:15px;font-weight:500;color:#000;white-space:nowrap;">Приостановить</p>
      </div>
      <div style="padding-left:32px;margin-top:2px;">
        <p style="font-family:var(--ff);font-size:11px;font-weight:500;color:#4d4d4d;line-height:1.2;">поставить пополнения на паузу</p>
      </div>
    </div>

    <!-- Delete -->
    <div style="margin:12px 12px 0;display:flex;align-items:center;gap:8px;">
      <img src="assets/edit-trash.svg" alt=""
        style="width:24px;height:24px;flex-shrink:0;max-width:none;" />
      <p style="font-family:var(--ff);font-size:15px;font-weight:500;color:#000;white-space:nowrap;">Удалить</p>
    </div>

    <!-- Bottom spacer -->
    <div style="height:874px;pointer-events:none;"></div>

  </div>

  <!-- Home indicator -->
  <div style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
    width:134px;height:5px;background:#000;border-radius:3px;opacity:0.2;z-index:5;"></div>

</div>
</body>
</html>
